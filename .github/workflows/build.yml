name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.5"
          channel: stable
          cache: true

      - name: Pub get
        run: |
          set +e
          flutter pub get > pub.txt 2>&1
          STATUS=$?
          tail -n 30 pub.txt
          if [ $STATUS -ne 0 ]; then
            msg=$(grep -v '║' pub.txt | grep -v '╔' | grep -v '╚' | head -c 1500 | tr '\n' ' ')
            echo "::error::PUB ${msg}"
          fi
          exit $STATUS

      - name: Tests
        run: flutter test --no-pub
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.txt 2>&1
          STATUS=$?
          cat analyze.txt
          # Ubah setiap error analyzer jadi annotation agar mudah dibaca.
          grep -E '^ *error •' analyze.txt | head -40 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | awk -F ' • ' '{print $2}')
            loc=$(printf '%s' "$line" | awk -F ' • ' '{print $3}')
            file=$(printf '%s' "$loc" | cut -d: -f1)
            ln=$(printf '%s' "$loc" | cut -d: -f2)
            echo "::error file=${file},line=${ln}::${msg}"
          done
          exit $STATUS

  build:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.5"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Configure signing and build mode
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.XDOTS_KEYSTORE_BASE64 }}
          XDOTS_STORE_PASSWORD: ${{ secrets.XDOTS_STORE_PASSWORD }}
          XDOTS_KEY_ALIAS: ${{ secrets.XDOTS_KEY_ALIAS }}
          XDOTS_KEY_PASSWORD: ${{ secrets.XDOTS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$XDOTS_STORE_PASSWORD" ] && [ -n "$XDOTS_KEY_ALIAS" ] && [ -n "$XDOTS_KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xdots-release.jks"
            echo "XDOTS_KEYSTORE_PATH=$RUNNER_TEMP/xdots-release.jks" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing is not configured; building a debug-signed preview, not a production release."
          fi
      - name: Build APK (arm64-v8a)
        env:
          XDOTS_STORE_PASSWORD: ${{ secrets.XDOTS_STORE_PASSWORD }}
          XDOTS_KEY_ALIAS: ${{ secrets.XDOTS_KEY_ALIAS }}
          XDOTS_KEY_PASSWORD: ${{ secrets.XDOTS_KEY_PASSWORD }}
          BUILD_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set +e
          flutter build apk --"$BUILD_MODE" --target-platform android-arm64 > build.txt 2>&1
          STATUS=$?
          tail -n 120 build.txt
          if [ $STATUS -ne 0 ]; then
            grep -n -E '^e: |error:|What went wrong|Execution failed|Could not|Unresolved|incompatible|Caused by|Dart compiler|Error:' build.txt | head -25 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | cut -c1-420 | tr -d '\r')
              echo "::error::${clean}"
            done
            ctx=$(grep -A8 'What went wrong' build.txt | head -14 | tr '\n' ' ' | cut -c1-900)
            echo "::error::CTX ${ctx}"
          fi
          exit $STATUS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xdots-arm64-${{ steps.signing.outputs.mode }}
          path: build/app/outputs/flutter-apk/app-${{ steps.signing.outputs.mode }}.apk
          retention-days: 14
