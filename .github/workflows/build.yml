name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.5"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (report errors as annotation)
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.txt 2>&1 || true
          python3 - <<'PY'
          import re
          t = open('analyze.txt', encoding='utf-8', errors='replace').read().splitlines()
          errs = [l.strip() for l in t if re.match(r'\s*error\s+[•-]', l)]
          tail = [l for l in t if 'issues found' in l or 'No issues' in l]
          body = '\n'.join(errs[:400] + tail)
          body = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=ANALYZE_ERRORS (%d)::%s' % (len(errs), body))
          PY
