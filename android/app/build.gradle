plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.dots.muse"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.dots.muse"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    // Private signing values come only from an ignored file or CI environment.
    def signingProperties = new Properties()
    def signingPropertiesFile = rootProject.file('key.properties')
    if (signingPropertiesFile.exists()) {
        signingPropertiesFile.withInputStream { signingProperties.load(it) }
    }
    def signingValue = { String property, String environment ->
        signingProperties.getProperty(property) ?: System.getenv(environment)
    }
    def releaseStorePath = signingValue('storeFile', 'XDOTS_KEYSTORE_PATH')
    def releaseStorePassword = signingValue('storePassword', 'XDOTS_STORE_PASSWORD')
    def releaseKeyAlias = signingValue('keyAlias', 'XDOTS_KEY_ALIAS')
    def releaseKeyPassword = signingValue('keyPassword', 'XDOTS_KEY_PASSWORD')
    def hasReleaseSigning = releaseStorePath && releaseStorePassword &&
            releaseKeyAlias && releaseKeyPassword && file(releaseStorePath).exists()
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    // Release must never silently fall back to the debug identity.
    gradle.taskGraph.whenReady { graph ->
        if (!hasReleaseSigning && graph.allTasks.any {
            it.name == 'packageRelease' || it.name == 'bundleRelease'
        }) {
            throw new GradleException('Release signing is not configured. Use key.properties or XDOTS signing environment variables; use a debug build for previews.')
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
